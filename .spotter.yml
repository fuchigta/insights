# insights 自身の検査設定。
#
# .githooks/commit-msg と .github/workflows/ci.yml（repo guards / commit message
# ジョブ）が spotter check --config .spotter.yml を通じてこのファイルを読む。
# ドキュメントの対応表・拒否ルール・許可 type 一覧はここに集約されている
# （旧 scripts/doc-sync.tsv・scripts/doc-paths-ignore.txt は削除済み。
# docs/hooks-extraction.md §6 参照）。

checks:
  doc-sync:
    type: doc-sync
    pairs:
      - paths: 'internal/cli/*.go'
        doc: README.md
        when: '^[+-].*(Use:|Short:|Flags\(\)\.|AddCommand\()'
      - paths: 'internal/judge/prompts/*'
        doc: docs/reports.md
      - paths: 'internal/rollup/prompts/*'
        doc: docs/reports.md
      - paths: 'internal/rollup/synth.go'
        doc: docs/reports.md
        when: '^[+-].*"description"'
      - paths: 'internal/render/format.go'
        doc: docs/reports.md
        when: '^[+-].*yaml:"'
      - paths: 'internal/config/config.go'
        doc: docs/configuration.md
      - paths: 'internal/pricing/*'
        doc: docs/cost.md
      - paths: 'internal/judge/claudecli/*.go'
        doc: docs/cost.md
        when: '^[+-].*defaultMaxBudgetUSD'
      - paths: 'internal/judge/codexcli/*.go'
        doc: docs/cost.md
        when: '^[+-].*defaultTimeout'
      - paths: 'internal/source/*/*.go'
        doc: docs/development.md
        when: '^[+-].*(Subdir|SUBDIR|rolloutPrefix|compressedSuffix|memoryDirName|subagentsDirName)'
      - paths: 'internal/update/*.go'
        doc: docs/configuration.md
      - paths: 'internal/update/*.go'
        doc: docs/privacy.md
        when: '^[+-].*(NewRequestWithContext|User-Agent|userAgent)'
      - paths: 'internal/skill/*/*.go'
        doc: docs/configuration.md
        when: '^[+-].*(skillsDirName|codexHomeDirName|"skills")'
      - paths: 'scripts/check-*.sh'
        doc: docs/development.md
      - paths: 'scripts/check-*.sh'
        doc: docs/hooks-extraction.md
        when: '^[+-].*(PATTERN=|SKIP_PATTERN|TABLE=|IGNORE=|MAX_BYTES)'
      - paths: '.githooks/*'
        doc: docs/development.md
      - paths: '.github/dependabot.yml'
        doc: docs/development.md
      - paths: '.github/workflows/*.yml'
        doc: docs/development.md
        when: '^[+-].*(name:|run:|if:)'

  unwanted-files:
    type: unwanted-files
    # 現在の追跡ファイルの最大は 44KB 程度。scripts/check-unwanted-files.sh と同じ閾値。
    max_bytes: 1048576
    deny:
      - paths: '*.db'
        reason: 利用者のデータベース
      - paths: '*.db-wal'
        reason: 利用者のデータベース
      - paths: '*.db-shm'
        reason: 利用者のデータベース
      - paths: '*.jsonl'
        reason: 取り込み元のセッションログ（他人との会話が入りうる）
      - paths: '.insights/*'
        reason: insights の実データ置き場
      - paths: '*/.insights/*'
        reason: insights の実データ置き場

  doc-paths:
    type: doc-paths
    # docs 省略時の既定（README.md / CLAUDE.md / docs/*.md / .github/*.md）で
    # 旧 scripts/check-doc-paths.sh と同じ対象になる。
    ignore:
      - internal/source/codex
      # docs/hooks-extraction.md は移行の経緯を記した設計メモで、削除済みの
      # 旧シェルスクリプト・対応表を歴史的な参照として書いている（現存しない）。
      - scripts/check-doc-sync.sh
      - scripts/doc-sync.tsv
      - scripts/check-unwanted-files.sh
      - scripts/check-doc-paths.sh
      - scripts/doc-paths-ignore.txt
      - scripts/check-commit-subject.sh
      - scripts/check-commit-types.sh
      - scripts/check-*.sh

  commit-subject:
    type: commit-subject
    allowed_types: [feat, fix, perf, refactor, docs, test, build, ci, chore, revert]

  commit-types:
    type: consistency
    # 旧 scripts/check-commit-types.sh が突き合わせていた 3 箇所のうち、
    # 許可 type 一覧は scripts/check-commit-subject.sh 削除後は
    # checks.commit-subject.allowed_types（このファイル自身）に移っている。
    sources:
      - file: cliff.toml
        line: 'message = .\^[A-Za-z]+.'
        extract: '\^([A-Za-z]+)'
      - file: .spotter.yml
        line: '^\s*allowed_types:'
        extract: '\[([a-zA-Z, ]+)\]'
        split: ','
      - file: CLAUDE.md
        line: '^\| `[a-zA-Z]+` \|'
        extract: '`([a-zA-Z]+)`'
