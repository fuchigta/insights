# insights 自身の検査設定。
#
# .githooks/commit-msg と .github/workflows/ci.yml（repo guards / commit message
# ジョブ）が spotter check --config .spotter.yml を通じてこのファイルを読む。
# ドキュメントの対応表・拒否ルール・許可 type 一覧はここに集約されている。

# CI（.github/workflows/ci.yml の SPOTTER_VERSION）と合わせておく。上げるときは
# 両方を書き換えること。
required_version: v0.2.0

checks:
  doc-sync:
    type: doc-sync
    pairs:
      - paths: 'internal/cli/*.go'
        doc: README.md
        when: '^[+-].*(Use:|Short:|Flags\(\)\.|AddCommand\()'
      - paths: 'internal/judge/prompts/*'
        doc: docs/reports.md
      - paths: 'internal/rollup/prompts/*'
        doc: docs/reports.md
      - paths: 'internal/rollup/synth.go'
        doc: docs/reports.md
        when: '^[+-].*"description"'
      - paths: 'internal/render/format.go'
        doc: docs/reports.md
        when: '^[+-].*yaml:"'
      - paths: 'internal/config/config.go'
        doc: docs/configuration.md
      - paths: 'internal/pricing/*'
        doc: docs/cost.md
      - paths: 'internal/judge/claudecli/*.go'
        doc: docs/cost.md
        when: '^[+-].*defaultMaxBudgetUSD'
      - paths: 'internal/judge/codexcli/*.go'
        doc: docs/cost.md
        when: '^[+-].*defaultTimeout'
      - paths: 'internal/source/*/*.go'
        doc: docs/development.md
        when: '^[+-].*(Subdir|SUBDIR|rolloutPrefix|compressedSuffix|memoryDirName|subagentsDirName)'
      - paths: 'internal/update/*.go'
        doc: docs/configuration.md
      - paths: 'internal/update/*.go'
        doc: docs/privacy.md
        when: '^[+-].*(NewRequestWithContext|User-Agent|userAgent)'
      - paths: 'internal/skill/*/*.go'
        doc: docs/configuration.md
        when: '^[+-].*(skillsDirName|codexHomeDirName|"skills")'
      - paths: '.githooks/*'
        doc: docs/development.md
      - paths: '.github/dependabot.yml'
        doc: docs/development.md
      - paths: '.github/workflows/*.yml'
        doc: docs/development.md
        when: '^[+-].*(name:|run:|if:)'
    # テストは利用者に見える面を定義しないため対象から外す。
    exclude:
      - '**/*_test.go'

  unwanted-files:
    type: unwanted-files
    max_bytes: 1048576
    deny:
      - paths: '**/*.db'
        reason: 利用者のデータベース
      - paths: '**/*.db-wal'
        reason: 利用者のデータベース
      - paths: '**/*.db-shm'
        reason: 利用者のデータベース
      - paths: '**/*.jsonl'
        reason: 取り込み元のセッションログ（他人との会話が入りうる）
      - paths: '**/.insights/**'
        reason: insights の実データ置き場

  doc-paths:
    type: doc-paths
    docs:
      - README.md
      - CLAUDE.md
      - docs/*.md
      - .github/*.md
    path_prefixes: [internal, cmd, .githooks, .github]

  commit-subject:
    type: commit-subject
    allowed_types: [feat, fix, perf, refactor, docs, test, build, ci, chore, revert]

  commit-types:
    type: consistency
    # 許可 type 一覧の単一の情報源は checks.commit-subject.allowed_types
    # （このファイル自身）なので、突き合わせ元としてもここを参照する。
    sources:
      - file: cliff.toml
        line: 'message = .\^[A-Za-z]+.'
        extract: '\^([A-Za-z]+)'
      - file: .spotter.yml
        line: '^\s*allowed_types:'
        extract: '\[([a-zA-Z, ]+)\]'
        split: ','
      - file: CLAUDE.md
        line: '^\| `[a-zA-Z]+` \|'
        extract: '`([a-zA-Z]+)`'
