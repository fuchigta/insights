name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # insights の一部のテストは外部コマンド（git）を使い、無い場合は t.Skip する。
      # GitHub のランナーには git があるため、evidence の実リポジトリテストも実行される。
      # claude CLI は無いので、AI を実際に呼ぶテストはスキップされる（課金は発生しない）。
      - name: go test
        run: go test ./...

  lint:
    name: format & tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt で整形されていないファイルがあります:"
            echo "$unformatted"
            exit 1
          fi

      # go.mod / go.sum が最新の依存関係と一致しているかを確認する。
      - name: go mod tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "go mod tidy による差分があります。ローカルで go mod tidy を実行してコミットしてください。"
            exit 1
          fi

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 評価は cfg.Judge.Concurrency 並列で走り、DB 書き込みだけを直列化している。
      # その境界が壊れていないことを競合検出器で確認する。
      - name: go test -race
        run: go test -race ./...

  guards:
    name: repo guards
    runs-on: ubuntu-latest
    steps:
      # コミット単位で見る検査があるため履歴を全部持ってくる。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ローカルの commit-msg フックはすり抜けうる（フックは clone に含まれず、
      # 有効化も手動のため）。CI を最後の歯止めにする。逃げ道はコミットメッセージの
      # トレーラなので、ローカルで通した判断はここでもそのまま通る。
      - name: コミット範囲の算出
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/${BASE}..HEAD"
          elif [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..${GITHUB_SHA}"
          else
            # 新しいブランチの初回 push など、比較対象が無い場合は先頭のみ見る。
            range="-1 HEAD"
          fi
          echo "対象範囲: ${range}"
          echo "RANGE=${range}" >> "$GITHUB_ENV"

      - name: コードとドキュメントの対応
        run: ./scripts/check-doc-sync.sh "$RANGE"

      - name: ドキュメントが指すパスの実在
        run: ./scripts/check-doc-paths.sh

      - name: コミットしてはいけないものの混入
        run: ./scripts/check-unwanted-files.sh "$RANGE"

  commit-lint:
    name: commit message
    runs-on: ubuntu-latest
    steps:
      # 追加されたコミットの範囲を辿るため履歴を全部持ってくる。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ローカルの commit-msg フックはすり抜けうる（フックは clone に含まれず、
      # 有効化も手動のため）。CI を最後の歯止めにする。
      - name: Conventional Commits の検証
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/${BASE}..HEAD"
          elif [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..${GITHUB_SHA}"
          else
            # 新しいブランチの初回 push など、比較対象が無い場合は先頭のみ見る。
            range="-1"
          fi
          echo "対象範囲: ${range}"
          git log --format=%s "${range}" | ./scripts/check-commit-subject.sh
