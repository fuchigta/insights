name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # insights の一部のテストは外部コマンド（git）を使い、無い場合は t.Skip する。
      # GitHub のランナーには git があるため、evidence の実リポジトリテストも実行される。
      # claude CLI は無いので、AI を実際に呼ぶテストはスキップされる（課金は発生しない）。
      - name: go test
        run: go test ./...

  lint:
    name: format & tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt で整形されていないファイルがあります:"
            echo "$unformatted"
            exit 1
          fi

      # go.mod / go.sum が最新の依存関係と一致しているかを確認する。
      - name: go mod tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "go mod tidy による差分があります。ローカルで go mod tidy を実行してコミットしてください。"
            exit 1
          fi

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 評価は cfg.Judge.Concurrency 並列で走り、DB 書き込みだけを直列化している。
      # その境界が壊れていないことを競合検出器で確認する。
      - name: go test -race
        run: go test -race ./...

  guards:
    name: repo guards
    runs-on: ubuntu-latest
    steps:
      # コミット単位で見る検査があるため履歴を全部持ってくる。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: spotter/go.mod
          cache: true
          cache-dependency-path: spotter/go.sum

      - name: spotter のビルド
        run: |
          mkdir -p "$RUNNER_TEMP/spotter-bin"
          cd spotter
          go build -o "$RUNNER_TEMP/spotter-bin/spotter" ./cmd/spotter
          echo "$RUNNER_TEMP/spotter-bin" >> "$GITHUB_PATH"

      # ローカルの commit-msg フックはすり抜けうる（フックは clone に含まれず、
      # 有効化も手動のため）。CI を最後の歯止めにする。逃げ道はコミットメッセージの
      # トレーラなので、ローカルで通した判断はここでもそのまま通る。
      - name: コミット範囲の算出
        run: echo "RANGE=$(spotter range)" >> "$GITHUB_ENV"

      - name: コードとドキュメントの対応
        run: spotter check --config .spotter.yml doc-sync --range "$RANGE"

      # doc-paths / commit-types は現在の作業ツリーそのものを見る検査
      # （check.GranularityWorktree）なので、範囲の指定は不要。
      - name: ドキュメントが指すパスの実在
        run: spotter check --config .spotter.yml doc-paths

      - name: コミットしてはいけないものの混入
        run: spotter check --config .spotter.yml unwanted-files --range "$RANGE"

      - name: コミット type 一覧の整合
        run: spotter check --config .spotter.yml commit-types

  commit-lint:
    name: commit message
    runs-on: ubuntu-latest
    steps:
      # 追加されたコミットの範囲を辿るため履歴を全部持ってくる。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: spotter/go.mod
          cache: true
          cache-dependency-path: spotter/go.sum

      - name: spotter のビルド
        run: |
          mkdir -p "$RUNNER_TEMP/spotter-bin"
          cd spotter
          go build -o "$RUNNER_TEMP/spotter-bin/spotter" ./cmd/spotter
          echo "$RUNNER_TEMP/spotter-bin" >> "$GITHUB_PATH"

      # ローカルの commit-msg フックはすり抜けうる（フックは clone に含まれず、
      # 有効化も手動のため）。CI を最後の歯止めにする。
      - name: Conventional Commits の検証
        run: spotter check --config .spotter.yml commit-subject --range "$(spotter range)"

  # spotter/ は insights とは別の Go module なので、ルートの test/lint ジョブの
  # 対象に含まれない（go list ./... で検出されない）。切り出し前に Windows/macOS
  # でも動作確認できるよう、同じ形で 3 OS マトリクスにしておく。
  spotter-test:
    name: spotter test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: spotter/go.mod
          cache: true
          cache-dependency-path: spotter/go.sum

      - name: go vet
        working-directory: spotter
        run: go vet ./...

      - name: go build
        working-directory: spotter
        run: go build ./...

      - name: go test
        working-directory: spotter
        run: go test ./...

  spotter-lint:
    name: spotter format & tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: spotter/go.mod
          cache: true
          cache-dependency-path: spotter/go.sum

      - name: gofmt
        working-directory: spotter
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt で整形されていないファイルがあります:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy
        working-directory: spotter
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "go mod tidy による差分があります。ローカルで go mod tidy を実行してコミットしてください。"
            exit 1
          fi
